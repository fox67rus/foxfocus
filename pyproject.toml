[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"backend/migrations/**" = ["I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
asyncio_mode = "auto"
addopts = "-q"
